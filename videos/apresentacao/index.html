<!doctype html>
<html
  lang="pt-BR"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000000;
        --ink: #ffffff;
        --ember: #bc6d21;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html"
        data-start="0" data-duration="4.067" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="bio" data-composition-id="bio" data-composition-src="compositions/bio.html"
        data-start="4.067" data-duration="9.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="som" data-composition-id="som" data-composition-src="compositions/som.html"
        data-start="13.467" data-duration="9.366" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="lancamentos" data-composition-id="lancamentos" data-composition-src="compositions/lancamentos.html"
        data-start="22.833" data-duration="10.034" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="palcos" data-composition-id="palcos" data-composition-src="compositions/palcos.html"
        data-start="32.867" data-duration="14.066" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="booking" data-composition-id="booking" data-composition-src="compositions/booking.html"
        data-start="46.933" data-duration="13.067" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <audio id="musica" class="clip" src="assets/tripeddhopedd.wav"
        data-start="0" data-duration="60" data-track-index="3"
        data-volume="0.9" data-fade-out="2.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
