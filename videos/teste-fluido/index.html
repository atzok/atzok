<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
  {"id":"color-lilac","type":"color","label":"Lilás (fundo 1)","default":"#cdbaf0"},
  {"id":"color-plum","type":"color","label":"Ameixa (tinta)","default":"#2b0a3d"},
  {"id":"color-pink","type":"color","label":"Rosa choque","default":"#ff5aa8"},
  {"id":"color-cobalt","type":"color","label":"Cobalto","default":"#2238d6"},
  {"id":"color-paper","type":"color","label":"Papel","default":"#f3efe6"}
]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-lilac: #cdbaf0;
        --color-plum: #2b0a3d;
        --color-pink: #ff5aa8;
        --color-cobalt: #2238d6;
        --color-paper: #f3efe6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--color-lilac); }
      #root { position: relative; width: 100%; height: 100%; background: var(--color-lilac); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14"
      data-width="1080" data-height="1920">
      <div id="abertura" data-composition-id="abertura" data-composition-src="compositions/abertura.html"
        data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="pista" data-composition-id="pista" data-composition-src="compositions/pista.html"
        data-start="4.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="palcos" data-composition-id="palcos" data-composition-src="compositions/palcos.html"
        data-start="9" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
