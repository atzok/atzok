<template>
  <style>
    @font-face { font-family: "Bagel Fat One"; src: url("assets/fonts/bagelfatone.woff2") format("woff2"); }
    @font-face { font-family: "Permanent Marker"; src: url("assets/fonts/permanentmarker.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--color-pink, #ff5aa8); }
    #pi-svg { position: absolute; width: 0; height: 0; }
    .pi-type { position: absolute; color: var(--color-plum, #2b0a3d); filter: url(#pi-boil); }
    #pi-12 { left: 60px; top: 160px; font-family: "Bagel Fat One", sans-serif; font-size: 600px; line-height: 0.9; }
    #pi-12-in { display: inline-block; filter: url(#pi-melt); }
    #pi-anos { left: 80px; top: 760px; font-family: "Bagel Fat One", sans-serif; font-size: 170px; line-height: 1; }
    #pi-pista { left: 70px; top: 930px; font-family: "Bagel Fat One", sans-serif; font-size: 250px; line-height: 1; }
    .pi-l { display: inline-block; transform-origin: 50% 100%; }
    #pi-desde { left: 96px; top: 1300px; font-family: "Permanent Marker", sans-serif; font-size: 58px;
      transform: rotate(-3deg); transform-origin: 0 50%; }
    #pi-voodoo { left: 130px; top: 1410px; font-family: "Bagel Fat One", sans-serif; font-size: 170px; line-height: 1; }
    #pi-ring { position: absolute; left: 40px; top: 1360px; width: 1000px; height: 330px; overflow: visible; }
    #pi-ring path { fill: none; stroke: var(--color-plum, #2b0a3d); stroke-width: 9; stroke-linecap: round; }
    #pi-drip { position: absolute; left: 0; top: 0; width: 1080px; height: 2400px; overflow: visible; }
    #pi-drip path { fill: var(--color-paper, #f3efe6); }
  </style>
  <div id="root" data-composition-id="pista" data-width="1080" data-height="1920">
    <svg id="pi-svg" aria-hidden="true">
      <defs>
        <filter id="pi-boil" x="-5%" y="-10%" width="110%" height="120%">
          <feTurbulence id="pi-boil-t" type="fractalNoise" baseFrequency="0.025" numOctaves="1" seed="1" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="pi-melt" x="-15%" y="-15%" width="130%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.005 0.03" numOctaves="2" seed="7" result="n" />
          <feDisplacementMap id="pi-melt-d" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <div id="pi-12" class="pi-type clip" data-start="0" data-duration="4.5" data-track-index="1"><span id="pi-12-in">12</span></div>
    <div id="pi-anos" class="pi-type clip" data-start="0" data-duration="4.5" data-track-index="2">anos de</div>
    <div id="pi-pista" class="pi-type clip" data-start="0" data-duration="4.5" data-track-index="3"
      data-layout-allow-overflow>PISTA</div>
    <div id="pi-desde" class="pi-type clip" data-start="0" data-duration="4.5" data-track-index="4">desde os tempos do</div>
    <div id="pi-voodoo" class="pi-type clip" data-start="0" data-duration="4.5" data-track-index="5">Voodoohop</div>
    <svg id="pi-ring" class="clip" data-start="0" data-duration="4.5" data-track-index="6" viewBox="0 0 1000 330"
      data-layout-allow-overlap aria-hidden="true">
      <path id="pi-ring-p" d="M120,70 C330,20 760,10 930,90 C1010,140 980,250 820,285 C600,330 260,320 110,265 C10,228 20,120 150,80 C260,48 420,40 520,44" />
    </svg>
    <svg id="pi-drip" class="clip" data-start="0" data-duration="4.5" data-track-index="7" viewBox="0 0 1080 2400"
      data-layout-allow-overflow aria-hidden="true"><path id="pi-drip-p" d="" /></svg>
  </div>
  <script>
    (function () {
      // paper curtain with a dripping lower edge (fixed drip list, no randomness)
      const drips = [[40, 120, 46], [190, 330, 60], [330, 90, 38], [470, 410, 70], [640, 160, 44], [790, 280, 56], [960, 140, 50]];
      let d = "M0,0 H1080 V1960";
      [...drips].reverse().forEach(([x, len, w]) => {
        const l = x + w / 2, r = x - w / 2, y = 1960;
        d += ` L${l},${y} C${l},${y + len} ${l - 4},${y + len + w / 2} ${x},${y + len + w / 2} C${r + 4},${y + len + w / 2} ${r},${y + len} ${r},${y}`;
      });
      d += " L0,1960 Z";
      document.getElementById("pi-drip-p").setAttribute("d", d);

      document.querySelectorAll("#pi-pista, #pi-anos").forEach((w) => {
        w.innerHTML = [...w.textContent].map((c) => c === " " ? " " : `<span class="pi-l">${c}</span>`).join("");
      });

      const tl = gsap.timeline({ paused: true });
      // 12 pours in: liquid warp settles while it springs up from the floor
      tl.fromTo("#pi-melt-d", { attr: { scale: 220 } }, { attr: { scale: 0 }, duration: 1.2, ease: "power3.out" }, 0);
      tl.fromTo("#pi-12-in", { scaleY: 0, scaleX: 1.4, transformOrigin: "50% 100%" },
        { scaleY: 1, scaleX: 1, duration: 0.9, ease: "elastic.out(1, 0.4)" }, 0);

      const pop = (sel, t0, step) => gsap.utils.toArray(sel).forEach((el, i) => {
        const t = t0 + i * step;
        tl.fromTo(el, { y: -360, scaleY: 1.5, scaleX: 0.75, opacity: 0 },
          { y: 0, scaleY: 1.5, scaleX: 0.75, opacity: 1, duration: 0.26, ease: "power2.in" }, t);
        tl.to(el, { scaleY: 0.6, scaleX: 1.3, duration: 0.07 }, t + 0.26);
        tl.to(el, { scaleY: 1, scaleX: 1, duration: 0.55, ease: "elastic.out(1.1, 0.35)" }, t + 0.33);
      });
      pop("#pi-anos .pi-l", 0.55, 0.045);
      pop("#pi-pista .pi-l", 0.9, 0.07);
      // PISTA keeps dancing: a travelling sine wave, finite repeats
      gsap.utils.toArray("#pi-pista .pi-l").forEach((el, i) => {
        tl.fromTo(el, { y: 0 }, { y: -34, duration: 0.33, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.9 + i * 0.09);
      });

      tl.fromTo("#pi-desde", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power1.inOut" }, 1.7);
      tl.fromTo("#pi-voodoo", { opacity: 0, scale: 0.4, transformOrigin: "0% 60%" },
        { opacity: 1, scale: 1, duration: 0.8, ease: "elastic.out(1, 0.45)" }, 2.25);
      const len = document.getElementById("pi-ring-p").getTotalLength();
      tl.fromTo("#pi-ring-p", { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } },
        { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power2.inOut" }, 2.6);

      for (let k = 0, t = 0; t < 4.5; k++, t = k / 12) tl.set("#pi-boil-t", { attr: { seed: (k % 4) + 1 } }, t);

      // exit: paper melts down over everything
      tl.fromTo("#pi-drip", { y: -2420 }, { y: 0, duration: 0.8, ease: "power2.in" }, 3.66);
      window.__timelines["pista"] = tl;
    })();
  </script>
</template>
