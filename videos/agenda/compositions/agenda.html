    <div id="ag-contour" class="clip" data-start="0" data-duration="15" data-track-index="11" data-layout-ignore>

    <div class="ag-fold-v"></div><div id="ag-fold-h1" class="ag-fold-h"></div><div id="ag-fold-h2" class="ag-fold-h"></div>
    </div>

  <script>
    (function () {
      const F = 1 / 30;                       // um frame
      const tl = gsap.timeline({ paused: true });
      const late = { immediateRender: false };

      const G = "43,174,76", P = "238,60,152";      // verde e rosa riso, em rgb
      const sh = (x, y, c, a) => `${x}px ${y}px 0px rgba(${c},${a})`;

      // CAMADA SECUNDÁRIA · prensa: o papel afunda em 1 frame quando a tinta bate e volta em 6
      const press = (t, amp = 3) => {
        tl.to("#ag-sheet", { y: amp, duration: F, ease: "none" }, t);
        tl.to("#ag-sheet", { y: 0, duration: 6 * F, ease: "power2.out" }, t + F);
      };
      // carimbo: tinta bate em 1 frame e o corpo assenta de 1.06 → 1 (papel: sem overshoot)
      const stamp = (sel, t) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: F, ease: "none" }, t);
        tl.fromTo(sel, { scale: 1.06 }, { scale: 1, duration: 0.25, ease: "expo.out" }, t);
      };
      // registro desalinhado: a outra tinta chega deslocada e encaixa em 2 frames
      const misreg = (sel, t, c) => {
        tl.fromTo(sel, { textShadow: sh(10, -7, c, 1) },
          { textShadow: sh(0, 0, c, 1), duration: 2 * F, ease: "steps(2)" }, t + F);
        tl.to(sel, { textShadow: sh(0, 0, c, 0), duration: F, ease: "none" }, t + 3 * F);
      };
      // máquina de escrever: revela 1 caractere por passo (fonte mono)
      const type = (sel, t, chars, perChar) => {
        tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" },
          { clipPath: "inset(0 0% 0 0)", duration: chars * perChar, ease: `steps(${chars})` }, t);
      };
      // flicker de fotocópia: 2 frames a 0.55
      const flicker = (sel, t) => tl.fromTo(sel, { opacity: 1 },
        { opacity: 0.55, duration: F, yoyo: true, repeat: 1, ease: "none", ...late }, t);
      // saída: as tintas se separam (sombra verde escorrega) e o bloco some acelerando, 4 frames
      const lift = (wrap, inks, t) => {
        if (inks) tl.to(inks, { textShadow: sh(-9, 6, G, 0.9), duration: 3 * F, ease: "power3.in" }, t);
        tl.to(wrap, { opacity: 0, duration: 3 * F, ease: "power3.in" }, t + F);
      };

      // 0.00 · frame 0 já é o gancho: ÄTZØK + retícula na tela
      // 0.40 · AGENDA bate em rosa com a tinta verde fora de registro, que encaixa em 2 frames
      stamp("#ag-agenda-in", 0.4);
      press(0.4, 4);
      tl.fromTo("#ag-ghost-in", { opacity: 0, x: 12, y: -8 }, { opacity: 0.9, duration: F, ease: "none" }, 0.4);
      tl.to("#ag-ghost-in", { x: 0, y: 0, duration: 2 * F, ease: "steps(2)" }, 0.4 + F);
      tl.to("#ag-ghost-in", { opacity: 0, duration: F, ease: "none" }, 0.4 + 3 * F);
      flicker(["#ag-title-in", "#ag-agenda-in"], 1.0);                     // flicker #1

      // 1.20 · kicker digita
      type("#ag-kicker-in", 1.2, 23, 2 * F);

      // datas: data carimba (+prensa) → festa 3 frames depois → detalhe digita
      const rows = ["#ag-r0", "#ag-r1", "#ag-r2", "#ag-r3", "#ag-r4"];
      tl.fromTo("#ag-r0 .s", { scaleX: 0, rotation: -1.2, transformOrigin: "0% 50%" },
        { scaleX: 0, rotation: -1.2, duration: F }, 0);
      const row = (id, t, chars) => {
        stamp(`${id} .d`, t); misreg(`${id} .d`, t, G); press(t, 3);
        stamp(`${id} .v`, t + 3 * F); misreg(`${id} .v`, t + 3 * F, G);
        type(`${id} .x`, t + 0.3, chars, F);
      };
      // 2.30 · 15.11 entra normal… segura (antecipação) … e o marcador risca
      row("#ag-r0", 2.3, 6);
      tl.to("#ag-r0 .s", { scaleX: 1, duration: 0.3, ease: "power3.out" }, 3.1);
      press(3.1, 2);
      tl.to(["#ag-r0 .d", "#ag-r0 .v", "#ag-r0 .x"], { color: "#707070", duration: 0.3, ease: "power2.out" }, 3.15);

      // 4.0 → 7.6 · uma data a cada 1.2 s
      row("#ag-r1", 4.0, 8);
      row("#ag-r2", 5.2, 11);
      row("#ag-r3", 6.4, 14);
      row("#ag-r4", 7.6, 22);

      // 9.0 · curvas de nível sobem como scan de plotter (de baixo para cima)
      tl.fromTo("#ag-contour-in", { clipPath: "inset(100% 0 0 0)" },
        { clipPath: "inset(0% 0 0 0)", duration: 1.6, ease: "steps(32)" }, 9.0);

      // 10.9 · o barco (única data de 2027) ganha o registro desalinhado de novo + flicker #2
      tl.fromTo("#ag-r4 .d, #ag-r4 .v", { textShadow: sh(0, 0, G, 0) },
        { textShadow: sh(8, -6, G, 1), duration: F, ease: "none", ...late }, 10.9);
      tl.to("#ag-r4 .d, #ag-r4 .v", { textShadow: sh(0, 0, G, 0), duration: 3 * F, ease: "steps(3)" }, 10.9 + 2 * F);
      flicker("#ag-r4", 10.9);
      flicker(rows.slice(1).concat(["#ag-title-in", "#ag-agenda-in"]), 12.4); // flicker #3

      // 13.6 · saída: curvas descem, a tinta se separa e some em cascata inversa → frame 0 (loop)
      tl.to("#ag-contour-in", { clipPath: "inset(100% 0 0 0)", duration: 0.3, ease: "steps(8)" }, 13.6);
      ["#ag-r4", "#ag-r3", "#ag-r2", "#ag-r1", "#ag-r0"].forEach((id, i) =>
        lift(id, `${id} .d, ${id} .v`, 13.9 + i * 2 * F));
      lift("#ag-kicker-in", null, 13.9 + 10 * F);
      tl.to("#ag-agenda-in", { textShadow: sh(-9, 6, G, 0.9), duration: 3 * F, ease: "power3.in" }, 13.9 + 12 * F);
      tl.to("#ag-agenda-in", { opacity: 0, duration: 3 * F, ease: "power3.in", ...late }, 13.9 + 13 * F);
      press(13.9 + 13 * F, -2);   // o papel "solta" quando a última tinta sai

      // textura viva: retícula a cada 4 frames, grão a cada 2 frames (offsets fixos, determinísticos)
      let seed = 1557;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let t = 4 * F; t < 15; t += 4 * F) {
        tl.set("#ag-dither-in", { backgroundPosition: `${-Math.round(rnd() * 400)}px ${-Math.round(rnd() * 270)}px` }, t);
      }
      for (let t = 2 * F; t < 15; t += 2 * F) {
        tl.set("#ag-grain-in", { backgroundPosition: `${Math.round(rnd() * 1080)}px ${Math.round(rnd() * 1920)}px` }, t);
      }
      // volta ao offset inicial no último frame, para o loop casar
      tl.set("#ag-dither-in", { backgroundPosition: "0px 0px" }, 15 - F);
      tl.set("#ag-grain-in", { backgroundPosition: "0px 0px" }, 15 - F);

      window.__timelines["agenda"] = tl;
    })();
  </script>
