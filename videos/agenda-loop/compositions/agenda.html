      <rect width="1240" height="1510" filter="url(#ag-g)" />

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      // raios e pétalas
      let r = ""; for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2, l = i % 2 ? 70 : 108;
        r += `<line x1="${Math.cos(a) * 46}" y1="${Math.sin(a) * 46}" x2="${Math.cos(a) * l}" y2="${Math.sin(a) * l}" />`; }
      $("ag-raios").innerHTML = r;
      let d = "", prev; for (let i = 0; i <= 8; i++) { const a = (i / 8) * Math.PI * 2, b = ((i + 0.5) / 8) * Math.PI * 2;
        const p = [Math.cos(a) * 112, Math.sin(a) * 112]; d += i === 0 ? `M${p[0]} ${p[1]}` : ` Q${prev[0]} ${prev[1]} ${p[0]} ${p[1]}`; prev = [Math.cos(b) * 186, Math.sin(b) * 186]; }
      $("ag-petalas").setAttribute("d", d + " Z");

      const L = 40, TAU = Math.PI * 2;
      const onda = (t, P, fase) => Math.sin(TAU * (t / P + (fase || 0)));   // P divide 40 → loop perfeito
      const suave = (x) => x * x * (3 - 2 * x);
      const estrelas = [...$("ag-estrelas").children];
      const datas = [...document.querySelectorAll(".linha b")];
      const hash = (n) => { n = (n * 2654435761) >>> 0; return ((n ^ (n >>> 15)) % 1000) / 1000; };

      function quadro(t) {
        t = ((t % L) + L) % L;
        // ambiente: degradê respira devagar
        $("root").style.backgroundPosition = "0 " + (7.5 + 7.5 * onda(t, 20)).toFixed(2) + "%";
        // coqueiro balança como vento leve
        $("ag-palm").style.transform = `rotate(${(1.4 * onda(t, 10)).toFixed(3)}deg) translateX(${(6 * onda(t, 20, 0.25)).toFixed(2)}px)`;
        // brilho: gira uma volta a cada 40 s e pisca a cada 4 s
        const pisca = 1 + 0.08 * Math.pow(Math.max(0, onda(t, 4)), 6);
        $("ag-brilho").style.transform = `rotate(${(360 * t / L).toFixed(2)}deg) scale(${pisca.toFixed(3)})`;
        // flor gira devagar no sentido contrário
        $("ag-flor").style.transform = `rotate(${(-90 * t / L).toFixed(2)}deg)`;
        // itálico flutua
        $("ag-script").style.transform = `translateY(${(5 * onda(t, 8)).toFixed(2)}px) rotate(${(-6 + 0.8 * onda(t, 8, 0.25)).toFixed(3)}deg)`;
        // estrelas cintilam em cascata
        estrelas.forEach((el, i) => { if (el.textContent !== "★") return;
          const v = Math.max(0, onda(t, 4, -i * 0.11)); el.style.opacity = (0.55 + 0.45 * Math.pow(v, 3)).toFixed(3);
          el.style.transform = `scale(${(1 + 0.15 * Math.pow(v, 6)).toFixed(3)})`; });
        // datas: uma de cada vez sobe um pouco (ciclo de 10 s, 2 s por data)
        datas.forEach((el, i) => {
          const local = ((t % 10) - i * 2 + 10) % 10;          // 0..10
          const k = local < 0.5 ? suave(local / 0.5) : local < 1.5 ? 1 : local < 2 ? 1 - suave((local - 1.5) / 0.5) : 0;
          el.style.transform = `translateY(${(-8 * k).toFixed(2)}px)`;
        });
        // xadrez corre para a esquerda (520 px em 40 s = 20 casas)
        $("ag-xadrez").style.backgroundPosition = `${(-520 * t / L).toFixed(2)}px 0`;
        // grão muda 12 vezes por segundo, como filme
        const f = Math.floor(t * 12) % 480;
        $("ag-grao").style.transform = `translate(${Math.round(hash(f) * 40 - 20)}px, ${Math.round(hash(f + 999) * 40 - 20)}px)`;
      }
      window.addEventListener("hf-seek", (e) => quadro(e.detail.time));
      quadro(0);

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 0.01 }, 39.99);
      window.__timelines["agenda"] = tl;
    })();
  </script>
