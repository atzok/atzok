        const fit = window.__hyperframes && window.__hyperframes.fitTextFontSize
          ? window.__hyperframes.fitTextFontSize(t.textContent.toUpperCase(), { fontFamily: "Inter", fontWeight: 900, maxWidth: 840 })
          : null;
        if (fit && fit.fontSize < 124) t.style.fontSize = fit.fontSize + "px";
      } catch (e) {}

      const ctxOnda = $("rx-onda").getContext("2d");
      const ctxEsp = $("rx-esp").getContext("2d");
      const ctxFx = $("rx-fx").getContext("2d");
      const ctxSt = $("rx-st").getContext("2d");

      function onda(t) {
        const c = ctxOnda, w = 1680, h = 300, n = D.onda.length;
        c.clearRect(0, 0, w, h);
        if (!n) return;
        const bw = w / n, px = (t / D.duracao) * w, xd = (D.drop / D.duracao) * w;
        for (let i = 0; i < n; i++) {
          const x = i * bw, a = Math.max(2, (D.onda[i] / 100) * (h / 2 - 6));
          const depois = x >= xd, tocado = x + bw <= px;
          c.fillStyle = depois ? EMBER : PLUM;
          c.globalAlpha = tocado ? 1 : 0.28;
          c.fillRect(x + 1, h / 2 - a, Math.max(1, bw - 3), a * 2);
        }
        c.globalAlpha = 1;
        c.fillStyle = "#fff";
        c.fillRect(Math.min(w - 4, px), 0, 4, h);          // agulha
        c.fillStyle = EMBER;
        c.fillRect(xd - 2, 0, 4, h);                        // marca do drop
      }

      function curva(c, vals, w, h) {
        const n = vals.length;
        c.beginPath();
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * w, y = h - (vals[i] / 100) * (h - 16);
          i ? c.lineTo(x, y) : c.moveTo(x, y);
        }
      }

      function espectro(q, depois) {
        const c = ctxEsp, w = 1680, h = 380;
        c.clearRect(0, 0, w, 456);
        c.font = "700 56px 'Space Mono', monospace"; c.fillStyle = "#9a9a9a";
        [[30, "30"], [100, "100"], [300, "300"], [1000, "1k"], [3000, "3k"], [12000, "12k Hz"]].forEach(([f, txt]) => {
          c.textAlign = f === 30 ? "left" : f === 12000 ? "right" : "center";
          c.fillText(txt, fx(f) * 2, 450);
        });
        c.strokeStyle = GRID; c.lineWidth = 2;
        [100, 300, 1000, 3000].forEach((f) => { const x = fx(f) * 2; c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); });
        [0.25, 0.5, 0.75].forEach((k) => { c.beginPath(); c.moveTo(0, h * k); c.lineTo(w, h * k); c.stroke(); });
        const v = D.espectro[q];
        if (!v) return;
        if (depois && D.fantasma.length) {          // fantasma: os 2 s antes do drop
          curva(c, D.fantasma, w, h);
          c.strokeStyle = MUTED; c.lineWidth = 4; c.setLineDash([10, 10]); c.stroke(); c.setLineDash([]);
        }
        curva(c, v, w, h);
        c.lineTo(w, h); c.lineTo(0, h); c.closePath();
        c.fillStyle = depois ? "rgba(188,109,33,0.22)" : "rgba(126,64,110,0.28)";
        c.fill();
        curva(c, v, w, h);
        c.strokeStyle = depois ? EMBER : DUSK; c.lineWidth = 6; c.stroke();
      }

      const NOMES = ["Grave", "Corpo", "Médio", "Alto", "Ar"];
      function faixas(q, depois) {
        const c = ctxFx, w = 960, h = 640, v = D.faixas[q] || [0, 0, 0, 0, 0];
        c.clearRect(0, 0, w, h);
        const cols = 5, gap = 16, cw = (w - gap * (cols - 1)) / cols, segs = 12, sh = 30, sg = 8, base = 550;
        c.font = "700 56px 'Space Mono', monospace"; c.textAlign = "left"; c.fillStyle = "#9a9a9a";
        c.fillText("03  FAIXAS", 0, 50);
        c.font = "700 56px 'Space Mono', monospace"; c.textAlign = "center";
        for (let i = 0; i < cols; i++) {
          const x = i * (cw + gap), acesos = Math.round((v[i] / 100) * segs);
          for (let s = 0; s < segs; s++) {
            const y = base - (s + 1) * (sh + sg) + sg;
            c.fillStyle = s < acesos ? (i === 0 ? (depois ? EMBER : DUSK) : (depois ? "#e9e2d6" : "#8a8a8a")) : "#161616";
            c.fillRect(x, y, cw, sh);
          }
          c.fillStyle = i === 0 ? EMBER : "#9a9a9a";
          c.fillText(NOMES[i].toUpperCase(), x + cw / 2, base + 72);
        }
      }

      function estereo(q, depois) {
        const c = ctxSt, w = 660, h = 640, cx = w / 2, cy = 360, r = 220;
        c.clearRect(0, 0, w, h);
        c.font = "700 56px 'Space Mono', monospace"; c.textAlign = "left"; c.fillStyle = "#9a9a9a";
        c.fillText("04  ESTÉREO", 0, 50);
        c.strokeStyle = GRID; c.lineWidth = 2;
        [1, 0.66, 0.33].forEach((k) => { c.beginPath(); c.arc(cx, cy, r * k, 0, Math.PI * 2); c.stroke(); });
        c.beginPath(); c.moveTo(cx - r, cy); c.lineTo(cx + r, cy); c.moveTo(cx, cy - r); c.lineTo(cx, cy + r); c.stroke();
        c.fillStyle = depois ? EMBER : DUSK;
        // rastro: três quadros, o mais velho mais apagado
        for (let k = 2; k >= 0; k--) {
          const p = D.estereo[q - k];
          if (!p) continue;
          c.globalAlpha = [1, 0.5, 0.25][k];
          for (let i = 0; i < p.length; i += 2) {
            const x = cx + (p[i] / 100) * r, y = cy - (p[i + 1] / 100) * r;
            c.fillRect(x - 3, y - 3, 6, 6);
          }
        }
        c.globalAlpha = 1;
        c.font = "700 44px 'Space Mono', monospace"; c.fillStyle = "#9a9a9a"; c.textAlign = "left";
        c.fillText("L", 0, cy - 12); c.textAlign = "right"; c.fillText("R", w, cy - 12);
      }

      function desenhar(t) {
        const tt = Math.min(t, D.duracao - 1 / D.fps);
        const q = Math.max(0, Math.min((D.espectro.length || 1) - 1, Math.floor(tt * D.fps)));
        const depois = tt >= D.drop;
        onda(tt); espectro(q, depois); faixas(q, depois); estereo(q, depois);
        const comp = Math.min(D.compassos, Math.floor(tt / D.compasso) + 1);
        $("rx-comp").textContent = "Compasso " + pad2(comp) + " / " + pad2(D.compassos);
        $("rx-estado").textContent = depois ? "Drop" : "Break";
        $("rx-estado").style.color = depois ? EMBER : "#ffffff";
      }
      window.addEventListener("hf-seek", (e) => desenhar(e.detail.time));
      desenhar(0);

      // troca de frase no drop e encerramento
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rx-frase1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#rx-frase2", { opacity: 0, y: 14 }, { opacity: 0, y: 14, duration: 0.01 }, 0);
      tl.to("#rx-frase1", { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, Math.max(0, D.drop - 0.25));
      tl.to("#rx-frase2", { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, D.drop);
      tl.fromTo("#rx-fim", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#rx-fim", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, D.duracao);
      tl.fromTo("#rx-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, D.duracao + 0.3);
      tl.fromTo("#rx-handle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, D.duracao + 0.5);
      window.__timelines["painel"] = tl;
    })();
  </script>
</template>
