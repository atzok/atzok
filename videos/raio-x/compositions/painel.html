        $("rx-estado").style.color = depois ? EMBER : "#ffffff";
      }
      window.addEventListener("hf-seek", (e) => desenhar(e.detail.time));
      desenhar(0);

      // troca de frase no drop e encerramento
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rx-frase1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#rx-frase2", { opacity: 0, y: 14 }, { opacity: 0, y: 14, duration: 0.01 }, 0);
      tl.to("#rx-frase1", { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, Math.max(0, D.drop - 0.25));
      tl.to("#rx-frase2", { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, D.drop);
      tl.fromTo("#rx-fim", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#rx-fim", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, D.duracao);
      tl.fromTo("#rx-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, D.duracao + 0.3);
      tl.fromTo("#rx-handle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, D.duracao + 0.5);
      window.__timelines["painel"] = tl;
    })();
  </script>
</template>
