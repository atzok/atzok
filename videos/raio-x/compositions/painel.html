          const p = D.estereo[q - k];

          c.globalAlpha = [1, 0.5, 0.25][k];
          for (let i = 0; i < p.length; i += 2) {
            const x = cx + (p[i] / 100) * r, y = cy - (p[i + 1] / 100) * r;
            c.fillRect(x - 3, y - 3, 6, 6);
          }
        }
        c.globalAlpha = 1;
        c.font = "700 44px 'Space Mono', monospace"; c.fillStyle = "#9a9a9a"; c.textAlign = "left";
        c.fillText("L", 0, cy - 12); c.textAlign = "right"; c.fillText("R", w, cy - 12);
      }

      function desenhar(t) {
        const tt = Math.min(t, D.duracao - 1 / D.fps);
        const q = Math.max(0, Math.min((D.espectro.length || 1) - 1, Math.floor(tt * D.fps)));
        const depois = tt >= D.drop;
        onda(tt); espectro(q, depois); faixas(q, depois); estereo(q, depois);
        const comp = Math.min(D.compassos, Math.floor(tt / D.compasso) + 1);
        $("rx-comp").textContent = "Compasso " + pad2(comp) + " / " + pad2(D.compassos);
        $("rx-estado").textContent = depois ? "Drop" : "Break";
        $("rx-estado").style.color = depois ? EMBER : "#ffffff";
        const ver = ($("rx-versao").textContent || "").trim();
        $("rx-bpm").textContent = ver ? ver : D.bpm + " BPM";
      }
      window.addEventListener("hf-seek", (e) => desenhar(e.detail.time));
      desenhar(0);

      // troca de frase no drop e encerramento
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rx-frase1", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
      tl.fromTo("#rx-frase2", { opacity: 0, y: 14 }, { opacity: 0, y: 14, duration: 0.01 }, 0);
      tl.to("#rx-frase1", { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, Math.max(0, D.drop - 0.25));
      tl.to("#rx-frase2", { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, D.drop);
      tl.fromTo("#rx-fim", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#rx-fim", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, D.duracao);
      tl.fromTo("#rx-logo", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, D.duracao + 0.3);
      tl.fromTo("#rx-handle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, D.duracao + 0.5);
      tl.fromTo("#rx-credito", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, D.duracao + 0.8);
      window.__timelines["painel"] = tl;
    })();
  </script>
</template>
