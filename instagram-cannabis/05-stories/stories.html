<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Stories Cannabis Medicinal</title><link rel="stylesheet" href="../base/estilo.css">
<!-- Área segura dos stories: deixe livres os 250px do topo e os 340px de baixo (interface do Instagram). -->
</head>
<body>

<!-- 1 · POST NOVO -->
<section class="story grain" id="story-1" style="background:var(--laranja);color:var(--tinta)">
  <div class="abs leafrow" data-color="#304E3C" style="top:270px;left:0;right:0"></div>
  <div class="abs" style="left:72px;right:72px;top:420px">
    <span class="pill" style="background:var(--creme)">perspectiva crítica</span>
    <h1 style="font-size:190px;margin-top:40px">post novo no feed.</h1>
  </div>
  <div class="torn" style="left:200px;width:680px;top:930px;padding:22px;background:var(--creme);transform:rotate(-3deg)">
    <img src="../01-um-milhao/slide-1.png" style="width:100%;display:block">
  </div>
</section>

<!-- 2 · ENQUETE -->
<section class="story grain" id="story-2" style="background:var(--bg)">
  <svg class="abs burst" data-points="22" data-inner=".8" style="width:1060px;height:1060px;left:10px;top:250px" fill="#E86D3C"></svg>
  <div class="abs" style="left:210px;right:210px;top:570px;text-align:center;color:var(--tinta)">
    <h2 style="font-size:100px">você conhece alguém que se trata com cannabis?</h2>
  </div>
  <p class="abs serif" style="left:72px;right:72px;top:1350px;text-align:center;font-size:48px;color:var(--salvia)">vota aí embaixo ↓</p>
  <!-- espaço livre para o adesivo de enquete (bottom 360–540px) -->
</section>

<!-- 3 · CAIXINHA DE PERGUNTAS -->
<section class="story grain" id="story-3" style="background:var(--lilas);color:var(--tinta)">
  <div class="abs checker" data-a="#304E3C" data-b="#E86D3C" style="left:0;right:0;top:0;height:250px"></div>
  <div class="abs" style="left:72px;right:72px;top:380px">
    <span class="pill">caixinha</span>
    <h1 style="font-size:146px;margin-top:40px">o que você quer saber sobre <span style="color:var(--laranja)">cannabis medicinal?</span></h1>
  </div>
  <div class="torn" style="left:72px;right:240px;top:1240px;padding:30px 46px;background:var(--bg);color:var(--creme);transform:rotate(-2deg)">
    <p class="serif" style="font-size:48px">a gente responde no próximo post.</p>
  </div>
  <!-- espaço livre para o adesivo de perguntas (y 1400–1580px) -->
</section>

<script src="../base/decor.js"></script>
</body>
</html>
