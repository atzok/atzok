<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Rumo ao UP · carrosséis v2</title>
<style>
  @font-face { font-family: "Narrow"; font-weight: 700; src: url("fonts/archivo-narrow-700.woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; src: url("fonts/Inter-Regular.otf"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-Bold.otf"); }
  :root { --verm: #d8401f; --papel: #f4f1ea; --tinta: #111; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #444; display: flex; flex-wrap: wrap; gap: 30px; padding: 30px; width: 3420px; }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--papel); color: var(--tinta); font-family: Inter, sans-serif; }
  .cab { position: absolute; left: 56px; right: 56px; top: 44px; display: flex; justify-content: space-between; font-size: 26px; z-index: 6; }
  .cab b { font-weight: 700; letter-spacing: 0.02em; }
  .claro .cab { color: #fff; }
  .sombra { position: absolute; left: 0; right: 0; top: 0; height: 220px; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0)); z-index: 3; }
  .tarja { display: inline; background: var(--verm); color: #fff; font-family: Narrow, sans-serif; font-weight: 700; text-transform: uppercase;
    line-height: 1.08; padding: 0 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .titulo { font-family: Narrow, sans-serif; font-weight: 700; text-transform: uppercase; line-height: 0.98; letter-spacing: -0.01em; }
  .corpo { font-size: 30px; line-height: 1.3; }
  .corpo b { font-weight: 700; }
  .foto { position: absolute; object-fit: cover; }
  svg.rab { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 5; }

  .capa .foto { inset: 0; width: 100%; height: 100%; }
  .capa .bloco { position: absolute; left: 56px; bottom: 126px; z-index: 6; font-size: 150px; }
  .capa .sub { position: absolute; left: 56px; bottom: 66px; z-index: 6; color: #fff; font-size: 30px; font-weight: 700; text-shadow: 0 1px 12px rgba(0,0,0,0.5); }
  .capa .sub i { font-style: normal; background: #111; padding: 2px 10px; text-shadow: none; }

  .branco .titulo { position: absolute; left: 56px; right: 56px; top: 170px; font-size: 92px; }
  .branco .foto { left: 330px; top: 700px; width: 420px; height: 315px; }
  .branco .corpo { position: absolute; left: 56px; bottom: 70px; width: 600px; }

  .fototexto .foto { left: 0; top: 0; width: 100%; height: 860px; }
  .fototexto .titulo { position: absolute; left: 56px; top: 900px; font-size: 70px; width: 900px; }
  .fototexto .corpo { position: absolute; left: 56px; bottom: 70px; width: 640px; }
  .assin { position: absolute; right: 56px; bottom: 70px; font-size: 26px; text-align: right; }

  .frase .titulo { position: absolute; left: 56px; right: 56px; top: 420px; font-size: 104px; }
  .frase .corpo { position: absolute; left: 56px; bottom: 70px; width: 640px; }

  .player .rotulo { position: absolute; left: 56px; top: 150px; font-size: 40px; }
  .player .capa-img { position: absolute; left: 220px; top: 260px; width: 640px; height: 640px; object-fit: cover; }
  .player .info { position: absolute; left: 56px; right: 56px; top: 950px; display: flex; justify-content: space-between; align-items: flex-end; }
  .player h3 { font-family: Narrow, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 60px; line-height: 1; white-space: nowrap; }
  .player .info p { margin-top: 8px; font-size: 32px; }
  .player .prog { position: absolute; left: 56px; right: 56px; top: 1086px; }
  .player .trilho { height: 6px; background: #c9c4b8; position: relative; }
  .player .trilho b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tinta); }
  .player .trilho s { position: absolute; top: -9px; width: 24px; height: 24px; border-radius: 50%; background: var(--tinta); margin-left: -12px; }
  .player .tempos { display: flex; justify-content: space-between; margin-top: 14px; font-size: 24px; }
  .player .ctrl { position: absolute; left: 56px; right: 56px; top: 1160px; display: flex; justify-content: space-between; align-items: center; }

  .fim .foto { inset: 0; width: 100%; height: 100%; filter: brightness(0.45); }
  .fim .logo { position: absolute; left: 330px; top: 360px; width: 420px; z-index: 6; }
  .fim .data { position: absolute; left: 0; right: 0; top: 820px; text-align: center; z-index: 6; font-size: 140px; }
  .fim .onde { position: absolute; left: 0; right: 0; top: 1000px; text-align: center; z-index: 6; color: #fff; font-size: 32px; font-weight: 700; }
  .fim .arroba { position: absolute; left: 0; right: 0; top: 1050px; text-align: center; z-index: 6; color: #fff; font-size: 32px; }
</style>
</head>
<body>
<div id="cards" style="display: contents"></div>
<script>
const P = [
  { id: "0-chillout", cards: [
    { t: "capa", foto: "fotos/up-tecido.jpg", titulo: "Chillout<br>stage", sub: "<i>27.12</i>&nbsp; Universo Paralelo, Bahia", est: [830, 300, 150, 3] },
    { t: "branco", foto: "fotos/up-domo.jpg", titulo: "No chillout do UP a pista <span class=tarja>respira.</span>", corpo: "Pra deitar na areia, fechar o olho e <b>ouvir com calma.</b>", tituloPx: 120 },
    { t: "fototexto", foto: "fotos/up-noite.jpg", titulo: "Toca <span class=tarja>downtempo, dub, ambient</span> e música do mundo", corpo: "Tudo com grave e espaço pra respirar.", est: [250, 250, 110, 11] },
    { t: "frase", titulo: "Eu levo <span class=tarja>drum'n'bass, drum'n'bossa e dub</span>", corpo: "Nos próximos posts eu conto de onde vem cada um e por que eles se encontram no chillout.", est: [880, 1080, 120, 5, "#d8401f"] },
    { t: "player", capa: "capas/palafita.jpg", faixa: "Palafita Sunrise", artista: "Marcelinho Da Lua", dur: 264 },
    { t: "fim", foto: "fotos/up-domo.jpg" } ] },
  { id: "1-drum-n-bass", cards: [
    { t: "capa", foto: "fotos/caio-03.jpg", titulo: "Drum'n'<br>bass", sub: "<i>1/3</i>&nbsp; Londres, anos 90", est: [840, 330, 140, 21] },
    { t: "branco", foto: "fotos/caio-09.jpg", titulo: "Nasceu do jungle, nas raves e nos <span class=tarja>sound systems</span> de Londres", tituloPx: 84, corpo: "A cultura jamaicana do sound system encontrando <b>o breakbeat das raves inglesas.</b>" },
    { t: "fototexto", foto: "fotos/caio-05.jpg", titulo: "Breakbeat acelerado em cima de um <span class=tarja>grave profundo</span>", corpo: "A bateria roda perto dos 170 BPM e o baixo anda na metade. Por isso o corpo não corre junto.", est: [880, 240, 110, 23] },
    { t: "frase", titulo: "No chillout eu levo o lado <span class=tarja>atmosférico</span>", corpo: "Pads, jazz e espaço. <b>Photek, Peshay, Wax Doctor e Roni Size</b> estão no set.", est: [880, 1080, 120, 25, "#d8401f"] },
    { t: "player", capa: "capas/nile.jpg", faixa: "On The Nile", artista: "Peshay", dur: 502 },
    { t: "fim", foto: "fotos/caio-03.jpg" } ] },
  { id: "2-drum-n-bossa", cards: [
    { t: "capa", foto: "fotos/caio-10.jpg", titulo: "Drum'n'<br>bossa", sub: "<i>2/3</i>&nbsp; São Paulo, fim dos anos 90", est: [850, 300, 140, 31] },
    { t: "branco", foto: "fotos/caio-11.jpg", titulo: "Os DJs de São Paulo colocaram o <span class=tarja>Brasil</span> dentro do drum'n'bass", corpo: "Samba, bossa e MPB <b>no meio do breakbeat.</b>", tituloPx: 84 },
    { t: "fototexto", foto: "fotos/caio-01.jpg", titulo: "A bateria continua rápida. Por cima vêm <span class=tarja>violão, voz e percussão</span>", corpo: "", est: [880, 230, 110, 33] },
    { t: "frase", titulo: "No set tem <span class=tarja>DJ Patife</span> com Jair Oliveira, Drumagick, Marcelinho Da Lua e Bossacucanova", corpo: "", tituloPx: 86, est: [880, 1100, 110, 35, "#d8401f"] },
    { t: "player", capa: "capas/grooves.jpg", faixa: "Grooves, Rítmos, Sons e Vinhetas", artista: "DJ Patife, Jair Oliveira", dur: 207 },
    { t: "fim", foto: "fotos/caio-10.jpg" } ] },
  { id: "3-dub", cards: [
    { t: "capa", foto: "fotos/caio-08.jpg", titulo: "Dub", sub: "<i>3/3</i>&nbsp; Jamaica, anos 70", est: [840, 320, 140, 41] },
    { t: "branco", foto: "fotos/caio-07.jpg", titulo: "Nasceu quando a Jamaica remixou o reggae <span class=tarja>na mesa de som</span>", corpo: "King Tubby e Lee Perry <b>estão nessa origem.</b>", tituloPx: 84 },
    { t: "fototexto", foto: "fotos/caio-02.jpg", titulo: "Tira a voz, sobe o baixo e joga <span class=tarja>eco e reverb</span>", corpo: "A mesa vira instrumento.", est: [880, 230, 110, 43] },
    { t: "frase", titulo: "É a <span class=tarja>raiz</span> dos outros dois", corpo: "O grave do sound system que depois <b>virou o drum'n'bass.</b>", tituloPx: 140, est: [880, 1080, 120, 45, "#d8401f"] },
    { t: "player", capa: "capas/cornerdub.jpg", faixa: "Corner Dub (Blue & Red Mix)", artista: "RSD", dur: 340 },
    { t: "fim", foto: "fotos/caio-08.jpg" } ] },
];

function rng(s) { return () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const linha = (pts, r, j) => "M" + pts.map(([x, y]) => (x + (r() - 0.5) * j).toFixed(1) + " " + (y + (r() - 0.5) * j).toFixed(1)).join(" L");
function estrela(cx, cy, R, seed, cor) {
  const r = rng(seed), ps = [];
  for (let k = 0; k < 2; k++) {
    const pts = [], n = 11 + k * 2, rr = R * (1 - k * 0.38);
    for (let i = 0; i <= n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2 + k * 0.3, m = i % 2 ? 0.42 + r() * 0.15 : 0.8 + r() * 0.45; pts.push([cx + Math.cos(a) * rr * m, cy + Math.sin(a) * rr * m]); }
    ps.push(linha(pts, r, 6));
  }
  for (let i = 0; i < 16; i++) { const a = r() * Math.PI * 2, a0 = R * (0.12 + r() * 0.2), a1 = a0 + R * (0.08 + r() * 0.12); ps.push(linha([[cx + Math.cos(a) * a0, cy + Math.sin(a) * a0], [cx + Math.cos(a) * a1, cy + Math.sin(a) * a1]], r, 2)); }
  return svg(ps, cor || "#fff");
}
function ondas(cx, cy, R, seed, cor) {
  const r = rng(seed), ps = [];
  for (let k = 0; k < 6; k++) {
    const pts = [], rx = R * (0.95 + k * 0.13), ry = R * (0.78 + k * 0.12);
    for (let i = 0; i <= 90; i++) { const a = (i / 90) * Math.PI * 2, w = 1 + 0.07 * Math.sin(a * 3 + k) + 0.05 * Math.sin(a * 5 - k * 2); pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]); }
    ps.push(linha(pts, r, 5));
  }
  return svg(ps, cor);
}
const svg = (ps, cor) => `<svg class="rab" width="1080" height="1350">${ps.map((p) => `<path d="${p}" fill="none" stroke="${cor}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`).join("")}</svg>`;
const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.round(s % 60)).padStart(2, "0");
const IC = {
  prev: '<svg width="56" height="56" viewBox="0 0 24 24" fill="#111"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  pause: '<svg width="116" height="116" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#d8401f"/><rect x="16" y="14" width="5" height="20" fill="#fff"/><rect x="27" y="14" width="5" height="20" fill="#fff"/></svg>',
  next: '<svg width="56" height="56" viewBox="0 0 24 24" fill="#111"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>',
  shuffle: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  repeat: '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
};
const CAB = '<div class="cab"><b>ÄTZØK:*</b><span>*rumo ao chillout do UP</span></div>';

const root = document.getElementById("cards");
P.forEach((post) => post.cards.forEach((c, i) => {
  const el = document.createElement("section");
  el.id = post.id + "-" + String(i + 1).padStart(2, "0");
  const claro = ["capa", "fototexto", "fim"].includes(c.t);
  el.className = "card " + c.t + (claro ? " claro" : "");
  let h = "";
  if (c.t === "capa") h = `<img class="foto" src="${c.foto}"><div class="sombra"></div>${CAB}<div class="bloco"><span class="tarja">${c.titulo}</span></div><div class="sub">${c.sub}</div>`;
  if (c.t === "branco") h = `${CAB}<div class="titulo" style="${c.tituloPx ? "font-size:" + c.tituloPx + "px" : ""}">${c.titulo}</div><img class="foto" src="${c.foto}">${ondas(540, 858, 225, i * 7 + 3, "#d8401f")}<div class="corpo">${c.corpo}</div>`;
  if (c.t === "fototexto") h = `<img class="foto" src="${c.foto}"><div class="sombra"></div>${CAB}<div class="titulo">${c.titulo}</div><div class="corpo">${c.corpo}</div><div class="assin">*desliza →</div>`;
  if (c.t === "frase") h = `${CAB}<div class="titulo" style="${c.tituloPx ? "font-size:" + c.tituloPx + "px" : ""}">${c.titulo}</div><div class="corpo">${c.corpo}</div>`;
  if (c.t === "player") {
    const pos = 0.38;
    h = `${CAB}<div class="rotulo"><span class="tarja">Tocando no set do UP</span></div><img class="capa-img" src="${c.capa}">${estrela(870, 280, 95, i * 13 + 7, "#d8401f")}
      <div class="info"><div><h3 style="font-size:${c.faixa.length > 22 ? 48 : 60}px">${c.faixa}</h3><p>${c.artista}</p></div></div>
      <div class="prog"><div class="trilho"><b style="width:${pos * 100}%"></b><s style="left:${pos * 100}%"></s></div><div class="tempos"><span>${mmss(c.dur * pos)}</span><span>-${mmss(c.dur * (1 - pos))}</span></div></div>
      <div class="ctrl">${IC.shuffle}${IC.prev}${IC.pause}${IC.next}${IC.repeat}</div>`;
  }
  if (c.t === "fim") h = `<img class="foto" src="${c.foto}">${CAB}<img class="logo" src="wordmark-branco.png" alt="Ätzøk"><div class="data titulo"><span class="tarja">27.12</span></div><div class="onde">Chillout stage · Universo Paralelo</div><div class="arroba">@_atzok</div>${estrela(820, 1180, 90, 77)}`;
  if (c.est && c.t !== "player") h += estrela(c.est[0], c.est[1], c.est[2], c.est[3], c.est[4]);
  el.innerHTML = h;
  root.appendChild(el);
}));
</script>
</body>
</html>
