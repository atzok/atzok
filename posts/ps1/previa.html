<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Ätzøk · select track</title>
<style>
  @font-face { font-family: "Black"; src: url("fonts/archivo-black.woff2"); }
  @font-face { font-family: "Narrow"; font-weight: 700; src: url("fonts/archivo-narrow-700.woff2"); }
  @font-face { font-family: "Mono"; font-weight: 700; src: url("fonts/space-mono-700.woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; padding: 20px; width: max-content; }
  .tela { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #1b2230; font-family: Narrow; color: #fff; }
  .a { position: absolute; }
  #fundo { inset: 0; }
  .ouro { color: #ffcf3a; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; font-style: italic; text-transform: uppercase; }
  .painel { background: linear-gradient(180deg, rgba(70,82,104,0.92), rgba(32,38,52,0.92)); border: 4px solid #8d9bb3;
    box-shadow: inset 0 0 0 3px #1a1f2b, inset 4px 4px 0 5px rgba(255,255,255,0.12), 6px 6px 0 #000; }
  .chanfro { clip-path: polygon(28px 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%, 0 28px); }

  .faixa-v { left: 40px; top: 300px; width: 110px; height: 1240px; }
  .faixa-v span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap;
    font-family: Black; font-size: 104px; font-style: italic; color: #2c3a58; -webkit-text-stroke: 3px #7f93bd; letter-spacing: 0.02em; }

  .titulo { left: 170px; top: 300px; width: 870px; height: 110px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; }
  .titulo b { font-family: Black; font-size: 64px; font-style: italic; letter-spacing: 0.01em; color: #f2f2f2; text-shadow: 4px 4px 0 #000; }
  .titulo i { font-family: Black; font-size: 30px; line-height: 0.95; text-align: right; }

  .stats { left: 170px; top: 440px; width: 520px; padding: 22px 24px 18px; }
  .linha { display: flex; align-items: center; justify-content: space-between; height: 46px; gap: 16px; }
  .linha span { font-family: Black; font-size: 26px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; background: #3a4256; box-shadow: inset -2px -2px 0 rgba(0,0,0,0.35); }

  .retrato { left: 712px; top: 440px; width: 150px; height: 170px; padding: 8px; }
  .retrato img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .seta { font-family: Black; font-size: 48px; color: #ffb21a; text-shadow: 3px 3px 0 #000; }
  .icone { left: 712px; width: 150px; text-align: center; font-family: Black; font-size: 30px; }
  .icone small { display: block; font-size: 64px; line-height: 1; color: #fff; text-shadow: 4px 4px 0 #000; font-style: normal; }

  .perso { left: 620px; top: 960px; width: 420px; height: 490px; border-radius: 38px; overflow: hidden; }
  .perso .luz { position: absolute; inset: 0; background: radial-gradient(70% 55% at 50% 40%, #6b2018 0%, #2a0f12 60%, #0d0b12 100%); }
  .perso img { position: absolute; left: 30px; bottom: 0; width: 360px; image-rendering: pixelated; }

  .bio { left: 170px; top: 1010px; width: 420px; height: 440px; padding: 44px 26px 20px; }
  .tab { position: absolute; left: 22px; top: -30px; padding: 4px 22px; font-family: Black; font-size: 26px; color: #9fb0cf; background: #2a3346; border: 3px solid #8d9bb3; border-bottom: none; border-radius: 10px 10px 0 0; }
  .bio p { font-family: Black; font-size: 27px; line-height: 1.22; text-transform: uppercase; font-style: italic; color: #f4f4f4; text-shadow: 2px 2px 0 #000; }

  .placar { left: 170px; top: 1478px; width: 870px; height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
  .placar span { font-family: Black; font-size: 30px; }
  .placar b { font-family: Black; font-size: 30px; color: #fff; font-style: italic; }

  .controles { left: 70px; right: 40px; top: 1610px; display: flex; justify-content: space-between; align-items: center; font-family: Black; font-size: 30px; }
  .controles .bt { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; margin-right: 10px; font-size: 22px; font-style: normal; color: #fff; text-shadow: none; }

  .scan { inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0 2px, transparent 2px 4px); z-index: 30; }
  .grao { inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: 0.35; z-index: 31; }
</style>
</head>
<body>
<div class="tela" id="tela">
  <svg id="fundo" class="a" width="1080" height="1920">
    <filter id="sujo"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="5" seed="8" /><feColorMatrix values="0 0 0 0 0.20  0 0 0 0 0.25  0 0 0 0 0.36  0 0 0 1.2 -0.25" /></filter>
    <rect width="1080" height="1920" fill="#1b2230" />
    <rect width="1080" height="1920" filter="url(#sujo)" />
    <path d="M0 260 L1080 200 L1080 250 L0 310 Z" fill="#2b3550" opacity="0.7" />
  </svg>

  <div class="a faixa-v"><span>SELECT TRACK</span></div>

  <div class="a titulo painel chanfro"><b>F/S SMITH GRIND</b><i class="ouro">Ätzøk<br>pro dj</i></div>

  <div class="a stats painel" id="stats"></div>

  <div class="a retrato painel"><img src="rosto.png" alt="" /></div>
  <div class="a seta" style="left: 672px; top: 500px">◀</div>
  <div class="a seta" style="left: 880px; top: 500px">▶</div>
  <div class="a icone ouro" style="top: 640px"><small>101</small>BPM</div>
  <div class="a icone ouro" style="top: 770px"><small>B</small>breaks</div>

  <div class="a perso painel"><div class="luz"></div><img src="caio-ps1.png" alt="Ätzøk em estilo PS1" /></div>

  <div class="a bio painel"><div class="tab">BIO</div>
    <p>Faixa do Ätzøk com nome de manobra. Breakbeat, grave gordo e o groove entrando cheio aos 0:21. Da Zona Oeste pro mundo.</p>
  </div>

  <div class="a placar painel chanfro"><span class="ouro">compasso</span><b>08 / 25</b><span class="ouro">drop</span><b>0:21</b></div>

  <div class="a controles ouro">
    <span><i class="bt" style="background:#3a66d8">✕</i>play</span>
    <span><i class="bt" style="background:#e0a000">◀</i>girar</span>
    <span><i class="bt" style="background:#3aa356">▲</i>espectro</span>
    <span style="color:#fff">@_atzok</span>
  </div>

  <div class="a scan"></div>
  <svg class="a grao" width="1080" height="1920"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="13" /><feColorMatrix type="saturate" values="0" /></filter><rect width="1080" height="1920" filter="url(#g)" /></svg>
</div>
<script>
  // atributos da faixa (no vídeo vêm do áudio, compasso a compasso)
  const ST = [["Grave", 8], ["Corpo", 6], ["Breakbeat", 7], ["Groove", 8], ["Atmosfera", 5], ["Brilho", 4], ["Estéreo", 6], ["Pressão", 7], ["Swing", 6], ["Viagem", 9]];
  const COR = ["#e8231b", "#ef3a17", "#f45a14", "#f77c12", "#f99f12", "#fbc117", "#f6d81f", "#c8dc28", "#8fd43a", "#5bc94c"];
  document.getElementById("stats").innerHTML = ST.map(([n, v]) =>
    `<div class="linha"><span class="ouro">${n}</span><span class="dots">${COR.map((c, i) => `<i style="${i < v ? "background:" + c : ""}"></i>`).join("")}</span></div>`).join("");
</script>
</body>
</html>
