<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Ätzøk · select track v2</title>
<style>
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/barlow-condensed-700-latin.woff2"); unicode-range: U+0000-00FF; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("fonts/barlow-condensed-700-latin-ext.woff2"); unicode-range: U+0100-024F; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 400; src: url("fonts/barlow-condensed-400-latin.woff2"); }
  @font-face { font-family: "Silkscreen"; font-weight: 400; src: url("fonts/silkscreen-400-latin.woff2"); }
  @font-face { font-family: "Silkscreen"; font-weight: 700; src: url("fonts/silkscreen-700-latin.woff2"); }
  :root { --creme: #f4ead2; --ouro: #ffc23a; --painel: rgba(8, 6, 12, 0.72); --linha: rgba(244, 234, 210, 0.35); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; padding: 20px; width: max-content; }
  .tela { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--creme); }
  .a { position: absolute; }
  .cena { inset: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
  .veu { inset: 0; background: linear-gradient(180deg, rgba(6,4,10,0.85) 0%, rgba(6,4,10,0.55) 22%, rgba(6,4,10,0.1) 36%, rgba(6,4,10,0) 45%, rgba(6,4,10,0.35) 58%, rgba(6,4,10,0.9) 78%, rgba(6,4,10,0.95) 100%); }

  .topo { left: 72px; right: 72px; top: 250px; display: flex; justify-content: space-between; font-family: Silkscreen; font-size: 26px; letter-spacing: 0.04em; }
  .topo b { color: var(--ouro); font-weight: 700; }
  .nome { left: 66px; top: 300px; font-family: "Barlow Condensed"; font-weight: 700; font-size: 150px; line-height: 0.86; text-transform: uppercase; letter-spacing: -0.01em; color: #fff; }
  .artista { left: 72px; top: 572px; font-family: Silkscreen; font-size: 30px; color: var(--ouro); }

  .info { left: 72px; right: 72px; top: 1072px; display: flex; gap: 48px; font-family: Silkscreen; font-size: 24px; }
  .info span b { display: block; font-family: "Barlow Condensed"; font-weight: 700; font-size: 64px; line-height: 1; color: #fff; letter-spacing: 0; }

  .stats { left: 56px; right: 56px; top: 1196px; padding: 24px 28px 22px; background: var(--painel); border: 2px solid var(--linha);
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; row-gap: 6px; }
  .linha { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .linha span { font-family: "Barlow Condensed"; font-weight: 700; font-size: 34px; text-transform: uppercase; letter-spacing: 0.01em; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 16px; height: 16px; background: rgba(244,234,210,0.16); }

  .controles { left: 72px; right: 72px; top: 1540px; display: flex; gap: 40px; align-items: center; font-family: Silkscreen; font-size: 24px; }
  .controles span { display: flex; align-items: center; gap: 12px; }
  .controles .handle { margin-left: auto; color: var(--ouro); }

  .scan { inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 4px); }
</style>
</head>
<body>
<div class="tela" id="tela">
  <img class="a cena" src="cena-ps1.png" alt="Ätzøk em estilo PS1" />
  <div class="a veu"></div>

  <div class="a topo"><span>SELECT TRACK</span><b>LADO A · 1/1</b></div>
  <div class="a nome">F/S Smith<br>Grind</div>
  <div class="a artista">ÄTZØK</div>

  <div class="a info">
    <span>BPM<b>101</b></span>
    <span>DROP<b>0:21</b></span>
    <span>DURAÇÃO<b>1:54</b></span>
  </div>

  <div class="a stats" id="stats"></div>

  <div class="a controles">
    <span><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#7aa2ff" stroke-width="3"/><path d="M11 11 L23 23 M23 11 L11 23" stroke="#7aa2ff" stroke-width="3" stroke-linecap="square"/></svg>PLAY</span>
    <span><svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#6fd38a" stroke-width="3"/><path d="M17 9 L25 23 L9 23 Z" fill="none" stroke="#6fd38a" stroke-width="3" stroke-linejoin="miter"/></svg>ESPECTRO</span>
    <span class="handle">@_atzok</span>
  </div>

  <div class="a scan"></div>
</div>
<script>
  // atributos (no vídeo vêm do áudio)
  const ST = [["Grave", 8], ["Breakbeat", 7], ["Corpo", 6], ["Groove", 8], ["Brilho", 4], ["Atmosfera", 5], ["Estéreo", 6], ["Swing", 6], ["Pressão", 7], ["Viagem", 9]];
  const COR = ["#e8402a", "#ee5a24", "#f2761f", "#f5931c", "#f7ae1c", "#f8c51f", "#e3d228", "#b8d634", "#8acd45", "#62c457"];
  document.getElementById("stats").innerHTML = ST.map(([n, v]) =>
    `<div class="linha"><span>${n}</span><span class="dots">${COR.map((c, i) => `<i style="${i < v ? "background:" + c : ""}"></i>`).join("")}</span></div>`).join("");
</script>
</body>
</html>
