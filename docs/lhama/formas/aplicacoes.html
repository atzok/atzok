<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Mockups de aplicação das formas. FORMAS = pasta dos PNGs (via ?f=caminho). -->
<style>
@font-face{font-family:Adca;src:url(../carrossel-onde-o-clube/Adca.ttf)}
@font-face{font-family:Mono;src:url(../carrossel-onde-o-clube/DMMono-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#777;display:flex;gap:40px;padding:40px;align-items:flex-start}
.c{position:relative;overflow:hidden;font-family:Adca}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;opacity:.32;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .47  0 0 0 0 .42  0 0 0 .6 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.feed{width:1080px;height:1350px}.story{width:1080px;height:1920px}
img.f{position:absolute;display:block}
.t{position:absolute;text-transform:uppercase;line-height:.9}
/* título no estilo do post: amarelo, contorno lavanda escuro, sombra empilhada */
.yt{color:#EEE27A;-webkit-text-stroke:7px #5A63CF;paint-order:stroke fill;text-shadow:0 7px 0 #E679D3,0 13px 0 #C3A6E6}
.ct{color:#F2EAD8;-webkit-text-stroke:8px #E679D3;paint-order:stroke fill;text-shadow:0 9px 0 #5A63CF}
.pill{position:absolute;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
 font-family:Adca;font-size:44px;color:#F2EAD8;text-transform:uppercase;letter-spacing:.02em}
.hl{display:inline;background:#E679D3;color:#151515;padding:.06em .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.5}
.logo{position:absolute}
</style></head><body>

<!-- 1. capa "Quem lhama com a gente?" refeita com as formas 09, 15 e 16 -->
<section class="c feed" id="a1" style="background:#B6D4A6">
  <img class="f" src="F/16-mancha-amarela.png" style="left:-260px;top:520px;width:820px">
  <img class="f" src="F/15-mancha-rosa-aneis.png" style="left:640px;top:520px;width:820px">
  <img class="f" src="F/09-minhoca-com-bracos.png" style="left:-120px;top:300px;width:1100px">
  <div class="t yt" style="left:150px;top:150px;font-size:104px;transform:rotate(-9deg)">Quem lhama<br>com a gente?</div>
  <img class="logo" src="../carrossel-onde-o-clube/img/nome-pb.png" style="left:700px;top:1180px;width:280px">
</section>

<!-- 2. story de line-up: fundo 06, moldura 20 com a lhama, pílulas 19 -->
<section class="c story" id="a2" style="background:#8A94E6">
  <img class="f" src="F/06-fundo-topografico.png" style="left:0;top:0;width:1080px">
  <img class="f" src="F/06-fundo-topografico.png" style="left:0;top:1350px;width:1080px;transform:scaleY(-1)">
  <div class="t ct" style="left:120px;top:300px;font-size:112px">Pra conhecer<br>no UP</div>
  <div style="position:absolute;left:300px;top:560px;width:480px;height:600px">
    <img class="f" src="F/20-moldura-arco-topografica.png" style="left:0;top:0;width:480px">
    <div style="position:absolute;left:144px;top:226px;width:192px;height:328px;border-radius:96px 96px 0 0;overflow:hidden;background:#EEE27A">
      <img src="../carrossel-onde-o-clube/img/head.png" style="position:absolute;left:10px;top:40px;width:200px">
    </div>
  </div>
  <div style="position:absolute;left:170px;top:1170px;width:740px">
    <div style="position:relative;height:222px;margin-bottom:-24px"><img class="f" src="F/19-pilula-etiqueta.png" style="width:100%"><div class="pill" style="height:200px">Ätzøk · Chillout</div></div>
    <div style="position:relative;height:222px;margin-bottom:-24px"><img class="f" src="F/19-pilula-etiqueta.png" style="width:100%"><div class="pill" style="height:200px">Artista · Pista</div></div>
    <div style="position:relative;height:222px"><img class="f" src="F/19-pilula-etiqueta.png" style="width:100%"><div class="pill" style="height:200px">Artista · Pista</div></div>
  </div>
  <img class="logo" src="../carrossel-onde-o-clube/img/nome-pb.png" style="left:430px;top:1790px;width:220px;filter:invert(1)">
</section>

<!-- 3. capa da série UP: linhas menta 07, anel 03 com texto em círculo, marca-texto -->
<section class="c feed" id="a3" style="background:#8A94E6">
  <img class="f" src="F/07-linhas-menta-meandro.png" style="left:-200px;top:-120px;width:1500px">
  <div style="position:absolute;left:215px;top:330px;width:650px;height:650px">
    <img class="f" src="F/03-topo-anel-vazado.png" style="left:0;top:0;width:650px">
    <svg viewBox="0 0 700 700" width="650" height="650" style="position:absolute;inset:0;overflow:visible">
      <defs><path id="circ" d="M350,350 m-212,0 a212,212 0 1,1 424,0 a212,212 0 1,1 -424,0"/></defs>
      <text font-family="Adca" font-size="40" fill="#E679D3" stroke="#F2EAD8" stroke-width="10" paint-order="stroke" letter-spacing="3">
        <textPath href="#circ" textLength="1325" lengthAdjust="spacing">UNIVERSO PARALELLO · PISTA PRA TODO MUNDO · UNIVERSO PARALELLO · </textPath></text>
    </svg>
    <img src="../carrossel-onde-o-clube/img/head.png" style="position:absolute;left:240px;top:180px;width:170px">
  </div>
  <div class="t yt" style="left:80px;top:80px;font-size:84px">Sabia que o UP tem<br>pista pra todo mundo?</div>
  <div style="position:absolute;left:80px;top:1010px;width:920px;font-family:Adca;font-size:42px">
    <span class="hl">Pista pra quem dança psy, pra quem</span><br><span class="hl">quer techno e pra quem só quer deitar.</span><br><span class="hl" style="font-size:.6em;background:#EEE27A">texto provisório</span>
  </div>
  <img class="logo" src="../carrossel-onde-o-clube/img/nome-pb.png" style="left:800px;top:1235px;width:200px">
</section>
</body></html>
