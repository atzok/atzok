<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Lhama · merch "anúncio clássico"</title>
<!-- Homenagem ao formato de logo de cigarro dos anos 90 (palavra em arco + silhueta),

<style>

.f{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:Adca}
.a{position:absolute}
</style></head><body>

<!-- L1 · logo amarelo sobre azul-noite -->

    <text font-family="Adca" font-size="190" fill="#EEE27A" letter-spacing="4" text-anchor="middle"><textPath href="#arc" startOffset="50%">LHAMA</textPath></text>
    <text x="540" y="610" font-family="Mono" font-size="26" fill="#EEE27A" letter-spacing="14" text-anchor="middle">BOOKINGS · SÃO PAULO</text>
    <use href="#llama" fill="#EEE27A" transform="translate(300 640) scale(1.45)"/>
  </svg>
</section>

<!-- L2 · logo marrom sobre mostarda (versão "maço clássico") -->
<section class="f" id="l2" style="background:var(--ochre)">
  <svg class="a" width="1080" height="1350" viewBox="0 0 1080 1350">
    <text font-family="Adca" font-size="170" fill="#8A5A3C" stroke="#4d2f1d" stroke-width="5" paint-order="stroke" letter-spacing="4" text-anchor="middle"><textPath href="#arc2" startOffset="50%">LHAMA</textPath></text>

    <use href="#llama" fill="#8A5A3C" stroke="#4d2f1d" stroke-width="5" transform="translate(330 720) scale(1.3)"/>
  </svg>
</section>

    <path d="M760 700 C820 760 835 900 850 1350 L700 1350 Z" fill="url(#suitS)"/>

    <path d="M470 620 L540 612 L610 620 L590 1000 L540 1060 L490 1000 Z" fill="#FBFAFF"/>

    <circle cx="540" cy="760" r="7" fill="#2b2b46"/><circle cx="540" cy="830" r="7" fill="#2b2b46"/><circle cx="540" cy="900" r="7" fill="#2b2b46"/>

  </svg>
  <!-- cabeça: o mascote da própria Lhama -->
  <img class="a" src="../../carrossel-onde-o-clube/img/head.png" style="left:345px;top:20px;width:330px;filter:drop-shadow(12px 18px 16px rgba(80,70,160,.35))">
  <!-- taça de martini na mão -->
  <svg class="a" width="1080" height="1350" viewBox="0 0 1080 1350" style="left:0;top:0">
    <path d="M250 1140 C240 1100 270 1060 310 1060 C350 1060 370 1100 360 1150 Z" fill="#D9A37A"/>
    <g transform="translate(250 900)">
      <path d="M0 0 L140 0 L76 80 L76 180 L110 192 L30 192 L64 180 L64 80 Z" fill="#ffffff" fill-opacity=".55" stroke="#2b2b46" stroke-width="5" stroke-linejoin="round"/>
      <path d="M22 20 L118 20 L76 72 L64 72 Z" fill="#EEE27A" fill-opacity=".85"/>
      <circle cx="88" cy="38" r="13" fill="#E679D3" stroke="#2b2b46" stroke-width="4"/><line x1="70" y1="58" x2="128" y2="-30" stroke="#2b2b46" stroke-width="4"/>
    </g>
  </svg>
  <div class="a" style="left:60px;bottom:50px;font-family:Mono;font-size:20px;letter-spacing:.2em;color:#4b4690">LHAMA BOOKINGS</div>

<section class="f" id="i2" style="background:linear-gradient(180deg,#6a2f86 0%,#3b3a9a 55%,#25235e 100%)">
  <svg class="a" width="1080" height="1350" viewBox="0 0 1080 1350">
    <defs>
      <linearGradient id="suit2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#E9E6F7"/><stop offset="1" stop-color="#ABA5DD"/></linearGradient>
      <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a3c"/><stop offset="1" stop-color="#0d0d16"/></linearGradient>

  </svg>
  <img class="a" src="../../carrossel-onde-o-clube/img/head.png" style="left:370px;top:230px;width:300px;filter:drop-shadow(10px 16px 14px rgba(0,0,0,.45))">
</section>
</body></html>
